name: Pixi build (Windows + GLUT)

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: latest
          cache: true

      - name: Build and install radia (with GLUT)
        run: pixi run pip install --no-build-isolation -e cpp/py

      - name: Smoke-test Radia import
        run: pixi run python -c "import radia; print(radia.UtiVer())"

      - name: Run field calculation test (headless - skip ObjDrwOpenGL)
        run: |
          pixi run python -c "
          import radia as rad
          m = rad.ObjRecMag([0,0,0], [1,1,1], [-0.5,1,0.7])
          B = rad.Fld(m, 'b', [0.52,0.6,0.7])
          expected = [0.12737, 0.028644, 0.077505]
          for got, exp in zip(B, expected):
              assert abs(got - exp) < 1e-4, f'{got} != {exp}'
          print('Field calculation OK:', B)
          "

      - name: Remove shadowing legacy binaries from env/radia_python
        shell: pwsh
        run: |
          Get-ChildItem env/radia_python -Filter "radia.pyd" | Rename-Item -NewName { $_.Name + ".bak" }
          Get-ChildItem env/radia_python -Filter "radia.so"  | Rename-Item -NewName { $_.Name + ".bak" }

      - name: Run RADIA_Example01
        working-directory: env/radia_python
        env:
          MPLBACKEND: Agg
        run: pixi run python RADIA_Example01.py

      - name: Run RADIA_Example02
        working-directory: env/radia_python
        env:
          MPLBACKEND: Agg
        run: pixi run python RADIA_Example02.py

      - name: Run RADIA_Example03
        working-directory: env/radia_python
        env:
          MPLBACKEND: Agg
        run: pixi run python RADIA_Example03.py

      - name: Run RADIA_Example04
        working-directory: env/radia_python
        env:
          MPLBACKEND: Agg
        run: pixi run python RADIA_Example04.py

      - name: Run RADIA_Example05
        working-directory: env/radia_python
        env:
          MPLBACKEND: Agg
        run: pixi run python RADIA_Example05.py

      - name: Run RADIA_Example06
        working-directory: env/radia_python
        env:
          MPLBACKEND: Agg
        run: pixi run python RADIA_Example06.py
