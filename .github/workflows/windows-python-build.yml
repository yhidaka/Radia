name: Linux and macOS source build

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade Python packaging tools
        run: pip install --upgrade pip setuptools wheel

      - name: Build and install Radia extension (source build)
        env:
          RADIA_BUILD_FROM_SOURCE: "1"
        run: pip install --no-build-isolation -e cpp/py

      - name: Smoke-test Radia import
        run: python -c "import radia; print(radia.UtiVer())"

      - name: Run field calculation test
        run: |
          python -c "
          import radia as rad
          m = rad.ObjRecMag([0,0,0], [1,1,1], [-0.5,1,0.7])
          B = rad.Fld(m, 'b', [0.52,0.6,0.7])
          expected = [0.12737, 0.028644, 0.077505]
          for got, exp in zip(B, expected):
              assert abs(got - exp) < 1e-4, f'{got} != {exp}'
          print('Field calculation OK:', B)
          "

      - name: Install matplotlib for example scripts
        run: pip install matplotlib

      - name: Run RADIA_Example01
        working-directory: env/radia_python
        env:
          MPLBACKEND: Agg
        run: python RADIA_Example01.py

      - name: Run RADIA_Example02
        working-directory: env/radia_python
        env:
          MPLBACKEND: Agg
        run: python RADIA_Example02.py

      - name: Run RADIA_Example03
        working-directory: env/radia_python
        env:
          MPLBACKEND: Agg
        run: python RADIA_Example03.py

      - name: Run RADIA_Example04
        working-directory: env/radia_python
        env:
          MPLBACKEND: Agg
        run: python RADIA_Example04.py

      - name: Run RADIA_Example05
        working-directory: env/radia_python
        env:
          MPLBACKEND: Agg
        run: python RADIA_Example05.py

      - name: Run RADIA_Example06
        working-directory: env/radia_python
        env:
          MPLBACKEND: Agg
        run: python RADIA_Example06.py
