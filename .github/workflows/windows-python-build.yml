name: Windows Python build

on:
  pull_request:
  push:
    branches:
      - codex/create-branch-for-windows-package-support
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64

      - name: Upgrade Python packaging tools
        run: py -m pip install --upgrade pip setuptools wheel

      - name: Build Radia extension in place
        working-directory: cpp/py
        run: py setup.py build_ext --inplace

      - name: Smoke-test Radia import
        working-directory: cpp/py
        run: py -c "import radia; print(radia.UtiVer())"
